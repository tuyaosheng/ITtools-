spring:
  application:
    name: ittools
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ittools}
    username: ${DB_USER:ittools}
    password: ${DB_PASSWORD:ittools}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 210MB
ittools:
  storage:
    root: ${STORAGE_ROOT:data/storage}
server:
  port: ${SERVER_PORT:8300}
  servlet:
    encoding:
      charset: UTF-8
      force: true
