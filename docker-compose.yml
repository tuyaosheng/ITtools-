services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ittools
      POSTGRES_USER: ittools
      POSTGRES_PASSWORD: ittools
    ports: ["5432:5432"]
    volumes: ["ittools-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ittools -d ittools"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/ittools
      DB_USER: ittools
      DB_PASSWORD: ittools
    ports: ["8080:8080"]
volumes:
  ittools-db:
